name: Trusted Pages packaging
on:
  pull_request:
    branches: ["main"]
permissions:
  contents: read
jobs:
  package:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: site
          retention-days: 1
